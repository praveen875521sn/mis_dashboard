<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ECP Impact Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:      #1a56db;
      --brand-dark: #1043a8;
      --danger:     #ef4444;
      --text:       #1e293b;
      --muted:      #64748b;
      --border:     rgba(255,255,255,0.25);
      --radius:     14px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background: #0f1720;
    }

    /* Full page background image */
    .bg-image {
      position: fixed;
      inset: 0;
      background-image: url('/static/images/background.jpeg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* Dark overlay so the card is readable */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(10, 18, 40, 0.30) 0%,
        rgba(10, 18, 40, 0.20) 50%,
        rgba(10, 18, 40, 0.30) 100%
      );
      z-index: 1;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
    }

    /* Glassmorphism card */
    .card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.60);
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
      padding: 38px 36px 32px;
    }

    /* Logo / branding inside card */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #1a56db, #1043a8);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(26,86,219,.4);
    }
    .brand-text h1 {
      font-size: 15px; font-weight: 700; color: #1e293b; line-height: 1.2;
    }
    .brand-text p {
      font-size: 11px; color: #64748b; margin-top: 2px;
    }

    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 0 0 22px;
    }

    .card h2 {
      font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 4px;
    }
    .card .subtitle {
      font-size: 13px; color: #64748b; margin-bottom: 22px; line-height: 1.5;
    }

    /* Role badges */
    .role-info {
      display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .role-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .role-badge.cmp { background: rgba(254,243,199,0.15); color: #fde68a; border: 1px solid rgba(253,230,138,0.3); }
    .role-badge.pm  { background: rgba(219,234,254,0.15); color: #93c5fd; border: 1px solid rgba(147,197,253,0.3); }
    .role-badge.cm  { background: rgba(209,250,229,0.15); color: #6ee7b7; border: 1px solid rgba(110,231,183,0.3); }
    .role-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Alert */
    .alert {
      display: none; padding: 10px 13px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; align-items: flex-start; gap: 8px;
    }
    .alert.error   { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); display: flex; }
    .alert.success { background: rgba(16,185,129,.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); display: flex; }
    .alert svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12.5px; font-weight: 600;
      color: #1e293b; margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-wrap .icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #94a3b8; width: 16px; height: 16px; pointer-events: none;
    }
    .input-wrap input {
      width: 100%; padding: 11px 12px 11px 38px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 14px; color: #1e293b; outline: none;
      transition: border-color .18s, background .18s;
    }
    .input-wrap input::placeholder { color: #adb5bd; }
    .input-wrap input:focus {
      border-color: #1a56db;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(26,86,219,.10);
    }
    .input-wrap .toggle-pw {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #94a3b8; padding: 2px; display: flex; align-items: center;
    }
    .input-wrap .toggle-pw:hover { color: #1a56db; }
    .pw-hint { font-size: 11px; color: #94a3b8; margin-top: 5px; }

    /* Button */
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1a56db, #1043a8);
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: opacity .18s, transform .12s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(26,86,219,.45);
      margin-top: 6px;
    }
    .btn-login:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 17px; height: 17px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      text-align: center; margin-top: 18px;
      font-size: 12px; color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="login-wrapper">
    <div class="card">

      <!-- Brand row -->
      <div class="brand-row">
        <div class="brand-icon">EC</div>
        <div class="brand-text">
          <h1> Impact Dashboard</h1>
          <p>Skills &amp; Employment Analytics</p>
        </div>
      </div>
      <div class="divider"></div>

      <h2>Welcome back</h2>
      <p class="subtitle"></p>

      <!-- Role badges -->
      <div class="role-info">
        <span class="role-badge cmp"><span class="dot"></span></span>
        <span class="role-badge pm"><span class="dot"></span></span>
        <span class="role-badge cm"><span class="dot"></span></span>
      </div>

      <!-- Alert -->
      <div class="alert" id="alertBox">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <span id="alertMsg"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="emailInput">Work Email</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
          </svg>
          <input type="email" id="emailInput" placeholder="sambhavfoundation.email id" autocomplete="email" />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="pwInput">Employee Code <span style="font-weight:400;color:rgba(255,255,255,0.4)">(Password)</span></label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
          </svg>
          <input type="password" id="pwInput" placeholder="Enter your Ecode (e.g. 311***)" autocomplete="current-password" />
          <button class="toggle-pw" type="button" onclick="togglePw()" title="Show/hide">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
              <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
        <p class="pw-hint">Your 6-digit Employee Code is your password.</p>
      </div>

      <!-- Submit -->
      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <span id="btnText">Sign In</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>

    </div>

    <div class="footer">Sambhav Foundation &nbsp;·&nbsp; ECP Program &nbsp;·&nbsp; Confidential</div>
  </div>

  <script>
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    function togglePw() {
      const inp = document.getElementById('pwInput');
      const ico = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.innerHTML = `<path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/>`;
      } else {
        inp.type = 'password';
        ico.innerHTML = `<path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>`;
      }
    }

    function showAlert(msg, type='error') {
      const box = document.getElementById('alertBox');
      box.className = `alert ${type}`;
      document.getElementById('alertMsg').textContent = msg;
    }
    function hideAlert() { document.getElementById('alertBox').className = 'alert'; }

    async function doLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const pw    = document.getElementById('pwInput').value.trim();
      hideAlert();
      if (!email) { showAlert('Please enter your work email.'); return; }
      if (!pw)    { showAlert('Please enter your Employee Code.'); return; }

      const btn     = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');
      btn.disabled = true;
      btnText.textContent = 'Signing in…';
      spinner.style.display = 'block';

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pw }),
        });
        const data = await res.json();
        if (data.success) {
          showAlert(`Welcome, ${data.user.name}! Redirecting…`, 'success');
          setTimeout(() => { window.location.href = '/'; }, 800);
        } else {
          const errMsg = data.error || 'Login failed. Please try again.';
          if (errMsg.includes('/setup/bootstrap')) {
            document.getElementById('alertMsg').innerHTML =
              'No users found. <a href="/setup/bootstrap" style="color:#93c5fd;text-decoration:underline;">Click here to create the first admin account →</a>';
            document.getElementById('alertBox').className = 'alert error';
          } else {
            showAlert(errMsg);
          }
          btn.disabled = false;
          btnText.textContent = 'Sign In';
          spinner.style.display = 'none';
        }
      } catch (err) {
        showAlert('Network error. Please check your connection.');
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
